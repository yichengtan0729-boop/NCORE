# ==========================
# EDIT PATHS IN THIS FILE ONLY
# ==========================
paths:
  project_root: /path/to/NCORE_multimodal
  output_root: /path/to/outputs/ncore

  # Final paired cohort manifest generated by scripts/build_manifest.py
  manifest: /path/to/processed/ncore_manifest.csv

  # Raw MIMIC-CXR
  mimic_cxr_root: /path/to/mimic-cxr-jpg/2.1.0
  cxr_metadata_csv: /path/to/mimic-cxr-jpg/2.1.0/mimic-cxr-2.0.0-metadata.csv.gz
  cxr_split_csv: /path/to/mimic-cxr-jpg/2.1.0/mimic-cxr-2.0.0-split.csv.gz

  # A prepared study/report index with columns:
  # subject_id, study_id, report_path, report_time
  report_index_csv: /path/to/processed/report_index.csv

  # Processed EHR window index with columns:
  # subject_id, hadm_id, stay_id, study_id (or index_time), ehr_path
  ehr_index_csv: /path/to/processed/ehr_index.csv

  # Hospital admissions for mortality label
  admissions_csv: /path/to/mimiciv/hosp/admissions.csv.gz

  # Derived ventilation intervals with columns:
  # subject_id, hadm_id, stay_id, starttime, endtime, ventilation_status
  ventilation_csv: /path/to/processed/ventilation.csv

  # Optional ICU transfer/stay tables
  icustays_csv: /path/to/mimiciv/icu/icustays.csv.gz
  transfers_csv: /path/to/mimiciv/hosp/transfers.csv.gz

  # Optional exact MedFuse repository + checkpoints.
  medfuse_repo: /path/to/MedFuse
  medfuse_cxr_checkpoint: /path/to/medfuse_cxr_checkpoint.pt
  medfuse_ehr_checkpoint: /path/to/medfuse_ehr_checkpoint.pt

  # Optional raw text encoder model, preferably a local HF cache/model directory.
  report_model_name_or_path: /path/to/Bio_ClinicalBERT_or_other_model
